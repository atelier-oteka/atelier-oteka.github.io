<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="L'Atelier d'Oteka" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- logo.svg — Logo de L'Atelier d'Oteka : monogramme « AO », le O remplace la barre du A. -->
  <defs>
    <linearGradient id="degrade" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="0.55" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <!-- Fond : carré arrondi en dégradé (mêmes couleurs que le fond du site) -->
  <rect width="64" height="64" rx="16" fill="url(#degrade)"/>
  <!-- Le A (deux jambes, sans barre) -->
  <path d="M12 52 L32 11 L52 52" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Le O, qui touche les jambes et sert de barre au A -->
  <circle cx="32" cy="38" r="8.5" fill="none" stroke="#fff" stroke-width="5.5"/>
</svg>
