<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="L'Atelier d'Oteka" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- logo.svg — Logo de L'Atelier d'Oteka : anneau « O » ouvert + étincelle (création). -->
  <defs>
    <linearGradient id="degrade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="0.55" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <!-- Fond : carré arrondi en dégradé (mêmes couleurs que le fond du site) -->
  <rect width="64" height="64" rx="16" fill="url(#degrade)"/>
  <!-- Anneau « O » ouvert en haut à droite -->
  <circle cx="30" cy="34" r="15" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"
          stroke-dasharray="70 24.25" transform="rotate(-2 30 34)"/>
  <!-- Étincelle à 4 branches dans l'ouverture -->
  <path fill="#fff" d="M44 9 Q45.2 17.8 54 19 Q45.2 20.2 44 29 Q42.8 20.2 34 19 Q42.8 17.8 44 9Z"/>
</svg>
