<!DOCTYPE html>
<!--
  outils.html — Comparatif d'outils d'IA par besoin.
  Besoins, conseil et fiches construits par js/outils.js depuis data/outils.js.
  L'en-tête et le pied de page sont injectés par js/commun.js.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B1020">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icones/icone-192.png">
<link rel="apple-touch-icon" href="icones/icone-180.png">
<title>Outils — Myia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/composants.css">
</head>
<body>

<div id="entete"></div>

<main>
<section class="section section--premiere">
  <div class="conteneur conteneur--etroit">
    <nav class="retours" aria-label="Retour">
      <a class="retour" href="index.html"><svg class="icone icone--retour" aria-hidden="true"><use href="#i-fleche"></use></svg>Accueil</a>
    </nav>
    <div class="section__tete">
      <h1 class="titre-2">Outils</h1>
      <p class="texte-doux texte-grand">Quel outil pour quel besoin. Sans classement : les outils sont par ordre alphabétique.</p>
    </div>
    <div class="filtres" id="besoins"></div>
    <p class="conseil" id="conseil" role="status"></p>
    <ul class="fiches" id="liste-outils"></ul>
    <p class="texte-doux texte-petit avertissement">Vérifié le <span id="date-verification"></span> à partir de comparatifs récents. Les offres changent souvent : confirmez toujours sur le site de l'outil avant de vous abonner.</p>
    <noscript><p class="texte-doux">Activez JavaScript pour afficher les outils.</p></noscript>
  </div>
</section>
</main>

<div id="pied"></div>

<!-- Ordre de chargement : données, éléments communs, puis script de la page -->
<script src="data/outils.js"></script>
<script src="js/commun.js"></script>
<script src="js/outils.js"></script>
</body>
</html>
