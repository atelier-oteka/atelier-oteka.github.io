<!DOCTYPE html>
<!--
  parcours.html — Choix du parcours.
  Quatre cartes de profil, construites par js/parcours.js depuis data/parcours.js.
  Chaque carte mène à programme.html, qui affiche le programme du profil.
  L'en-tête et le pied de page sont injectés par js/commun.js.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B1020">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icones/icone-192.png">
<link rel="apple-touch-icon" href="icones/icone-180.png">
<title>Choisir mon parcours — Myia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/composants.css">
</head>
<body>

<div id="entete"></div>

<main>
<section class="section section--premiere">
  <div class="conteneur">
    <nav class="retours" aria-label="Retour"><a class="retour" href="index.html"><svg class="icone icone--retour" aria-hidden="true"><use href="#i-fleche"></use></svg>Accueil</a></nav>
    <div class="section__tete">
      <h1 class="titre-2">Qui êtes-vous ?</h1>
      <p class="texte-doux texte-grand">Choisissez votre profil.</p>
    </div>
    <div class="profils" id="profils"></div>
    <noscript><p class="texte-doux">Activez JavaScript pour choisir un parcours.</p></noscript>
  </div>
</section>
</main>

<div id="pied"></div>

<!-- Ordre de chargement : données, progression, éléments communs, puis script de la page -->
<script src="data/parcours.js"></script>
<script src="js/progression.js"></script>
<script src="js/commun.js"></script>
<script src="js/parcours.js"></script>
</body>
</html>
