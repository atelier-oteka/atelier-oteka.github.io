<!DOCTYPE html>
<!--
  prompts.html — Bibliothèque de prompts.
  Catégories, recherche et fiches construites par js/prompts.js
  depuis data/prompts.js et les cas pratiques rédigés (data/cas.js).
  L'en-tête et le pied de page sont injectés par js/commun.js.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B1020">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icones/icone-192.png">
<link rel="apple-touch-icon" href="icones/icone-180.png">
<title>Prompts — Myia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/composants.css">
</head>
<body>

<div id="entete"></div>

<main>
<section class="section section--premiere">
  <div class="conteneur conteneur--etroit">
    <nav class="retours" aria-label="Retour">
      <a class="retour" href="index.html"><svg class="icone icone--retour" aria-hidden="true"><use href="#i-fleche"></use></svg>Accueil</a>
    </nav>
    <div class="section__tete">
      <h1 class="titre-2">Prompts</h1>
      <p class="texte-doux texte-grand">Prêts à copier. Remplacez les parties entre crochets.</p>
    </div>
    <div class="champ-recherche">
      <label class="texte-petit texte-doux" for="recherche">Rechercher un prompt</label>
      <input class="champ" type="search" id="recherche" placeholder="mail, résumé, code…" autocomplete="off">
    </div>
    <div class="filtres" id="categories"></div>
    <p class="texte-doux texte-petit" id="compteur" role="status"></p>
    <ul class="fiches" id="liste-prompts"></ul>
    <noscript><p class="texte-doux">Activez JavaScript pour afficher les prompts.</p></noscript>
  </div>
</section>
</main>

<div id="pied"></div>

<!-- Ordre de chargement : données, éléments communs, puis script de la page -->
<script src="data/cas.js"></script>
<script src="data/prompts.js"></script>
<script src="js/commun.js"></script>
<script src="js/prompts.js"></script>
</body>
</html>
