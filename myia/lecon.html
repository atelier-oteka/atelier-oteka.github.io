<!DOCTYPE html>
<!--
  lecon.html — Page d'une leçon.
  La leçon vient de l'adresse (lecon.html#bases-2).

  depuis data/parcours.js (titres, ordre) et data/lecons.js (contenu).
  L'en-tête et le pied de page sont injectés par js/commun.js.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B1020">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icones/icone-192.png">
<link rel="apple-touch-icon" href="icones/icone-180.png">
<title>Leçon — Myia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/composants.css">

<body>

<div id="entete"></div>

<main>

<div id="pied"></div>

<!-- Ordre de chargement : données, progression, éléments communs, puis script de la page -->
<script src="data/parcours.js"></script>
<script src="data/lecons.js"></script>
<script src="js/progression.js"></script>

<script src="js/lecon.js"></script>
